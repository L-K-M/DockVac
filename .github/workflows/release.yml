name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native-macos:
    name: Build native macOS release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        id: source
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag v$tag_version != app version $app_version"
            exit 1
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != 'tag' ]; then
            echo "::error::$GITHUB_REF must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit is not on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: scripts/build.sh --clean

      - name: Package ZIP and DMG
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          mkdir -p release "$RUNNER_TEMP/DockVac-dmg"
          zip="release/DockVac-$VERSION-macOS.zip"
          dmg="release/DockVac-$VERSION-macOS.dmg"

          ditto -c -k --sequesterRsrc --keepParent build/DockVac.app "$zip"
          ditto build/DockVac.app "$RUNNER_TEMP/DockVac-dmg/DockVac.app"
          ln -s /Applications "$RUNNER_TEMP/DockVac-dmg/Applications"
          hdiutil create -quiet -volname "DockVac $VERSION" \
            -srcfolder "$RUNNER_TEMP/DockVac-dmg" -ov -format UDZO "$dmg"
          (cd release && shasum -a 256 \
            "DockVac-$VERSION-macOS.zip" \
            "DockVac-$VERSION-macOS.dmg" > SHA256SUMS.txt)

      - name: Publish draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: DockVac ${{ steps.source.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### Unsigned build

            This app is ad-hoc signed, not Developer ID signed or notarized.
            Gatekeeper may require Control-clicking the app and choosing Open.
          files: release/*

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" \
            --pattern 'DockVac-*-macOS.zip' \
            --pattern 'DockVac-*-macOS.dmg' \
            --pattern 'SHA256SUMS.txt'

          failed=0
          for file in release/*; do
            published="$RUNNER_TEMP/published/$(basename "$file")"
            if ! cmp -- "$file" "$published"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$file")" -y \
                || echo "::warning::failed to remove mismatched asset $(basename "$file")"
              echo "::error::published $(basename "$file") differed and was removed"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
